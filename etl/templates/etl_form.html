<!DOCTYPE html>
<html>
<body>
<h2>Simple Web ETL</h2>

<form method="post">
    {% csrf_token %}
    <input name="url" size="80" placeholder="API URL" required><br><br>
    <textarea name="headers" rows="4" cols="80">{}</textarea><br><br>
    <input name="token" size="80" placeholder="Bearer token (optional)"><br><br>
    <button type="submit">Run ETL</button>
</form>

{% if result %}
<pre>{{ result }}</pre>
{% endif %}
</body>
</html>
